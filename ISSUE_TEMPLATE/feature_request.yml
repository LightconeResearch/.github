name: Feature request
description: Suggest a new idea, an enhancement to the existing functionalities.
labels: ['New Feature']

body:
- type: textarea
  attributes:
    label: What is the problem this feature will solve?
    description: >-
      What are you trying to do, that you are unable to achieve with this software?
- type: textarea
  attributes:
    label: Describe your proposed solution
    description: >-
      Clear and concise description of what you want to happen. Please use examples
      of real world use cases that this would help with, and how it solves the
      problem described above. If you want to, you can suggest a draft design or API
      so we can have a deeper discussion on the feature.
- type: textarea
  attributes:
    label: Additional context or alternatives you've considered, if relevant
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
