name: Bug Report
description: Create a report to help us reproduce and correct the bug
labels: ['bug']

body:
- type: markdown
  attributes:
    value: >
      #### Before submitting a bug, please make sure the issue hasn't been already
      raised.
- type: textarea
  attributes:
    label: Bug description
    description: >
      A clear and concise description of what the bug is.

      You can also paste screenshots into the text area.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected behavior
    description: >
      A clear and concise description of what you expected to happen.
  validations:
    required: false
- type: textarea
  attributes:
    label: How to Reproduce
    description: |
      Please provide steps to reproduce this bug.

      We acknowledge that crafting this requires some effort on your side but it really helps the maintainers quickly reproduce the problem and analyze its cause without any ambiguity.
  validations:
    required: false
- type: textarea
  attributes:
    label: Environment
    render: shell
    description: |
      To help us pin down the bug, please run the following in your terminal and paste the output below.
        uname -or
        python --version
        astra --version
        lc --version
    placeholder: >
      - OS: 
      - Python version: 
      - ASTRA version:
      - Lightcone version:
  validations:
    required: false
- type: markdown
  attributes:
    value: >
      Thanks for contributing 🎉!
